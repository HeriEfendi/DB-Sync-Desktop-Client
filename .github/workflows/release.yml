name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  build-tauri:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,rpm
            rust_target: ""
            tauri_args: ""
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            rust_target: ""
            tauri_args: ""
          - name: macOS-Intel
            os: macos-15
            bundles: app
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - name: macOS-Silicon
            os: macos-15
            bundles: app
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}
      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const v=process.argv[1]; for (const file of ['package.json','src-tauri/tauri.conf.json']) { const data=JSON.parse(fs.readFileSync(file)); data.version=v; fs.writeFileSync(file, JSON.stringify(data, null, 2)+'\\n'); } const cargo='src-tauri/Cargo.toml'; fs.writeFileSync(cargo, fs.readFileSync(cargo, 'utf8').replace(/^version\\s*=\\s*\"[^\"]+\"/m, 'version = \"' + v + '\"'));" "$VERSION"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Fetch all tags for changelog
        run: git fetch --tags --force

      - name: Generate release notes from commits
        id: release_notes
        shell: bash
        run: |
          # Cari tag sebelumnya
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)

          echo "Current tag: $CURRENT_TAG"
          echo "Previous tag: $PREVIOUS_TAG"

          # Generate daftar commit & merge
          if [ -n "$PREVIOUS_TAG" ]; then
            HEADER="### 📋 Changelog (since ${PREVIOUS_TAG})"
            RAW_COMMITS=$(git log "${PREVIOUS_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)")
          else
            HEADER="### 📋 Changelog"
            RAW_COMMITS=$(git log --pretty=format:"- %s (%h)" -20)
          fi

          # Filter commit release bump agar daftar perubahan fitur/merge lebih jelas terlihat
          COMMITS=$(echo "$RAW_COMMITS" | grep -v -E "^- Release v[0-9]" || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="$RAW_COMMITS"
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- No new changes documented."
          fi

          # Tulis multi-line output ke GITHUB_OUTPUT dengan heredoc delimiter
          {
            echo "body<<RELEASE_EOF"
            echo "$HEADER"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "_Automatic build for ${CURRENT_TAG}_"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }} ${{ matrix.tauri_args }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Create and upload macOS DMG package (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.rust_target }}"
          APP_PATH="src-tauri/target/${TARGET}/release/bundle/macos/DB-Sync Client.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="src-tauri/target/release/bundle/macos/DB-Sync Client.app"
          fi
          
          ARCH_LABEL="x64"
          if [ "$TARGET" = "aarch64-apple-darwin" ]; then
            ARCH_LABEL="aarch64"
          fi
          
          DMG_NAME="DB-Sync-Client_${VERSION}_${ARCH_LABEL}.dmg"
          echo "Packaging $APP_PATH into $DMG_NAME..."
          
          DMG_STAGING_DIR="dmg_staging_${ARCH_LABEL}"
          rm -rf "$DMG_STAGING_DIR"
          mkdir -p "$DMG_STAGING_DIR"
          cp -R "$APP_PATH" "$DMG_STAGING_DIR/"
          ln -s /Applications "$DMG_STAGING_DIR/Applications"
          
          hdiutil create -volname "DB-Sync Client" -srcfolder "$DMG_STAGING_DIR" -ov -format UDZO "$DMG_NAME"
          rm -rf "$DMG_STAGING_DIR"
          
          gh release upload "${GITHUB_REF_NAME}" "$DMG_NAME" --clobber

      - name: Create and upload Arch Linux package (.pkg.tar.zst)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y zstd
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/create-arch-pkg.mjs "$VERSION"
          gh release upload "${GITHUB_REF_NAME}" DB-Sync.Client-*.pkg.tar.zst --clobber
