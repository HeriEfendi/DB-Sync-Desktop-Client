name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  build-tauri:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const v=process.argv[1]; for (const file of ['package.json','src-tauri/tauri.conf.json']) { const data=JSON.parse(fs.readFileSync(file)); data.version=v; fs.writeFileSync(file, JSON.stringify(data, null, 2)+'\\n'); }" "$VERSION"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: DB-Sync Desktop Client ${{ github.ref_name }}
          releaseBody: Automatic Windows and Linux build for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false

      - name: Create and upload Arch Linux package (.pkg.tar.zst)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y zstd
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/create-arch-pkg.mjs "$VERSION"
          gh release upload "${GITHUB_REF_NAME}" db-sync-desktop-client-*.pkg.tar.zst --clobber

