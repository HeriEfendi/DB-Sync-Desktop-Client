[package]
name = "db-sync-desktop-client"
version = "0.6.2"
description = "DB-Sync Desktop Client - PMA to Local MySQL/MariaDB"
authors = ["DB-Sync Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-http = { version = "2.0", features = ["unsafe-headers"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "mysql", "json"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["cookies", "stream", "gzip"] }
flate2 = "1.0"
futures-util = "0.3"
urlencoding = "2.1"


[lib]
name = "db_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
