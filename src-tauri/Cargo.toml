[package]
name = "db-sync-desktop-client"
version = "1.0.0"
description = "DB-Sync Desktop Client - PMA to Local MySQL/MariaDB"
authors = ["DB-Sync Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-http = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "mysql", "json"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "db_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
